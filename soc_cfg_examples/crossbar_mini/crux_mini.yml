# ==============================================================================
# OLLIVANDER UNIFIED SoC ARCHITECTURE SCHEMA - crux_mini CONFIGURATION
# ==============================================================================
# The smallest SoC of the example fleet, and deliberately so (wave five,
# 2026-08-23): a bare Cheshire host plus one L2 memory, nothing else. It
# serves three purposes at once:
#   - the getting-started example: every block below is the minimum a real
#     project needs, with none of the optional machinery;
#   - the first regression of the generator's near-empty configuration
#     space (no clusters, no gated domains, no control groups, NO padframe -
#     phases 7 and 8 are skipped entirely, standalone variant of the path
#     the macro projects exercise);
#   - the fleet's fast vehicle for boot-road testing: light enough that
#     slow transports (the UART debug boot of wave five) stay affordable.
# ==============================================================================

project:
  name: "crux_mini"
  description: "Minimal Cheshire SoC: one host, one memory, no padframe"
  author: "Ollivander Generator"
  vendor: "Chips-IT"
  library: "SoC"
  version: "1.0.0"

# ------------------------------------------------------------------------------
# 1. TOPOLOGY & INTERCONNECT
# ------------------------------------------------------------------------------
topology:
  type: "crossbar"
  global_bus:
    protocol: "AXI4"
    data_width: 64
    addr_width: 48
    user_width: 10
    mst_id_width: 2

# ------------------------------------------------------------------------------
# 2. SYSTEM MICROARCHITECTURE SETTINGS
# ------------------------------------------------------------------------------
system_settings:
  user_mapping:
    amo_msb: 2
    amo_lsb: 0
    ecc_err_bit: 4
  llc:
    max_read_txns: 32
    max_write_txns: 32
    amo_num_cuts: 1
  reg_bus:
    max_read_txns: 8
    max_write_txns: 8
    amo_num_cuts: 1
    amo_post_cut: true

# ------------------------------------------------------------------------------
# 3. CLOCK & RESET DOMAINS
# ------------------------------------------------------------------------------
# No on-chip clock generators (the testbench drives the clocks directly, the
# same shape the mesh family uses); two domains, neither gated nor divided.
clock_tree:
  generators: 0
  domains:
    - name: "rt"
      description: "Real-Time Clock for CLINT and AON timers"
      is_real_time: true
      has_mux: false
      has_divider: false

    - name: "host"
      description: "The one functional clock: host and memory share it"
      is_real_time: false
      has_mux: false
      has_divider: false
      has_debug_divider: false

# ------------------------------------------------------------------------------
# 4. GLOBAL SYSTEM CONTROLLER & REGISTERS
# ------------------------------------------------------------------------------
system_controller:
  description: "Main system control and status registers (PCRs)"
  name: "sys_ctrl"
  base_addr: 0x20010000
  size: 0x00001000
  scratch_registers: 2
  version_registers: 1
  jedec_id: 0x00000000
  clk_gen_status_regs: false

# NOTE: no 'padframe' block, on purpose. The schema makes it optional; without
# it the generator skips Padrick and the chip wrapper (phases 7 and 8) and the
# project stops at the SoC top - which is also all the testbench instantiates.

# ------------------------------------------------------------------------------
# 5. HOST SYSTEM (Manager)
# ------------------------------------------------------------------------------
host:
  name: "manager"
  description: "Main application processor (Cheshire host)"
  type: "cheshire_isle"
  clock_domain: "host"
  isa: "rv64imafdc_zifencei"
  abi: "lp64d"
  cmodel: "medany"
  # uart carries the console (and, from wave five, the boot); jtag is the
  # architected boot and debug road.
  export_interfaces: ["jtag", "uart"]
  interfaces:
    axi_master: true
    axi_slave:
      - name: "internal_subsystem"
        base_addr: 0x00000000
        size: 0x20000000
  parameters:
    NumCores: 1
    RtcFreq: 1000000
    Bootrom: true
    Uart: true
    # Everything optional is off: this host is the minimum that boots.
    I2c: false
    SpiHost: false
    Dma: false
    SerialLink: false
    Vga: false
  interrupts:
    intr_ext_i:
      cdc: false
      source: >
        {
          [0] : l2_shared_memory.ecc_error_o
        }

# ------------------------------------------------------------------------------
# 6. SYSTEM COMPONENTS
# ------------------------------------------------------------------------------
components:
  - name: "l2_shared_memory"
    description: "Level 2 shared SRAM with ECC - the boot and work memory"
    type: "l2_isle"
    clock_domain: "host"
    system_config:
      is_l2_mem: true
    interfaces:
      # l2_isle connects through its async CDC ports (the only ones it has);
      # both sides run on the same clock here, the CDC just adds latency.
      axi_slave:
        - base_addr: 0x88000000
          size: 0x00100000
          sync_domain: false
      regbus_slave:
        - base_addr: 0x2000B000
          size: 0x00001000
          sync_domain: false

# ------------------------------------------------------------------------------
# 7. TESTBENCH
# ------------------------------------------------------------------------------
testbench:
  # The UART debug boot (wave five): the bootrom's own serial debug server
  # receives the image and the EXEC jump - no debugger, no link partner. This
  # is the fleet's uart representative, and the reason this project is small:
  # the protocol runs at the ROM-baked 115200, so the upload cost is pure
  # simulated time and only a light SoC keeps it affordable.
  boot_mode: uart
  preload_mode: uart
  boot_timeout_ns: 10000000
  boot_timeout_fast_ns: 2000000
  # The uart road is pure simulated time: ~29 ms of protocol upload at the
  # ROM-baked 115200 plus the console output. Cheap in wall clock on this SoC
  # (~146 us/s measured while the design idles on UART bits), but the deadline
  # must cover it.
  sim_timeout_ns: 50000000
  preload_memories:
    - instance: "i_l2_shared_memory"
      file: "generated/sw/{test_app}.hex"

# ------------------------------------------------------------------------------
# 8. SOFTWARE STACK & FIRMWARE
# ------------------------------------------------------------------------------
software_stack:
  toolchain: "riscv64-unknown-elf-"
  boot_memory: "l2_shared_memory"
  test_app:
    name: "hello_world"
    auto_generate_c: true
    # ONE baudrate for console and boot protocol, deliberately: the debug
    # server's EXEC ACK is still shifting out at the ROM-baked 115200 when the
    # firmware starts, and a firmware that immediately reprograms the divisor
    # to a faster console corrupts that in-flight byte (0xb0 instead of ACK,
    # found 2026-08-23). The references never meet this: their console baud
    # EQUALS the boot baud - so does this project's. Cost: ~3.5 ms simulated
    # for the hello-world output, cheap on a SoC this small.
    baudrate: 115200
