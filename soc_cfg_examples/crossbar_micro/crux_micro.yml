# ==============================================================================
# OLLIVANDER UNIFIED SoC ARCHITECTURE SCHEMA - crux_micro CONFIGURATION
# ==============================================================================
# The fleet's AUTONOMOUS-BOOT witness: crux_mini minus
# the debugger. The bootrom fetches the firmware BY ITSELF from an SPI NOR
# flash model - GPT scan, load of the ZSL partition into the host's internal
# scratchpad, jump - and the bench only preloads the device model and waits
# for the end-of-test byte. This is the finished-product-on-a-bench scenario:
# no JTAG export, no preload, no external agent of any kind. It is also the
# first project born with the reference-coherent memory map: the L2 lives
# inside the host's CIE window below 0x8000_0000 (astral's shape), not parked
# in the LlcOutRegion.
# ==============================================================================

project:
  name: "crux_micro"
  description: "Autonomous-boot Cheshire SoC: no debugger, no preload, no padframe"
  author: "Ollivander Generator"
  vendor: "Chips-IT"
  library: "SoC"
  version: "1.0.0"

# ------------------------------------------------------------------------------
# 1. TOPOLOGY & INTERCONNECT
# ------------------------------------------------------------------------------
topology:
  type: "crossbar"
  global_bus:
    protocol: "AXI4"
    data_width: 64
    addr_width: 48
    user_width: 10
    mst_id_width: 2

# ------------------------------------------------------------------------------
# 2. SYSTEM MICROARCHITECTURE SETTINGS
# ------------------------------------------------------------------------------
system_settings:
  user_mapping:
    amo_msb: 2
    amo_lsb: 0
    ecc_err_bit: 4
  llc:
    max_read_txns: 32
    max_write_txns: 32
    amo_num_cuts: 1
  reg_bus:
    max_read_txns: 8
    max_write_txns: 8
    amo_num_cuts: 1
    amo_post_cut: true

# ------------------------------------------------------------------------------
# 3. CLOCK & RESET DOMAINS
# ------------------------------------------------------------------------------
# Same shape as crux_mini: no on-chip generators, two ungated domains.
clock_tree:
  generators: 0
  domains:
    - name: "rt"
      description: "Real-Time Clock for CLINT and AON timers"
      is_real_time: true
      has_mux: false
      has_divider: false

    - name: "host"
      description: "The one functional clock: host and memory share it"
      is_real_time: false
      has_mux: false
      has_divider: false
      has_debug_divider: false

# ------------------------------------------------------------------------------
# 4. GLOBAL SYSTEM CONTROLLER & REGISTERS
# ------------------------------------------------------------------------------
system_controller:
  description: "Main system control and status registers (PCRs)"
  name: "sys_ctrl"
  base_addr: 0x20010000
  size: 0x00001000
  scratch_registers: 2
  version_registers: 1
  jedec_id: 0x00000000
  clk_gen_status_regs: false

# NOTE: no 'padframe' block, on purpose - same rationale as crux_mini.

# ------------------------------------------------------------------------------
# 5. HOST SYSTEM (Manager)
# ------------------------------------------------------------------------------
host:
  name: "manager"
  description: "Main application processor (Cheshire host)"
  type: "cheshire_isle"
  clock_domain: "host"
  isa: "rv64imafdc_zifencei"
  abi: "lp64d"
  cmodel: "medany"
  # uart carries the console (and the end-of-test byte); spi carries the boot
  # flash. NO jtag: an autonomous product needs no debugger, and dropping the
  # export is the point of this project.
  export_interfaces: ["uart", "spi"]
  interfaces:
    axi_master: true
    axi_slave:
      - name: "internal_subsystem"
        base_addr: 0x00000000
        size: 0x20000000
  parameters:
    NumCores: 1
    RtcFreq: 1000000
    Bootrom: true
    Uart: true
    I2c: false
    # The flash boots from chip select 1 (the host contract's BootSpiFlashCs),
    # so the SPI master needs two chip selects.
    SpiHost: true
    SpihNumCs: 2
    Dma: false
    SerialLink: false
    Vga: false
    # The CIE window [0x7800_0000, 0x8000_0000): the DESIGNED way to make the
    # external L2 cached+idempotent+executable for CVA6 (fleet practice since
    # wave six; astral's own values).
    Cva6ExtCieOnTop: true
    Cva6ExtCieLength: 0x08000000
  interrupts:
    intr_ext_i:
      cdc: false
      source: >
        {
          [0] : l2_shared_memory.ecc_error_o
        }

# ------------------------------------------------------------------------------
# 6. SYSTEM COMPONENTS
# ------------------------------------------------------------------------------
components:
  - name: "l2_shared_memory"
    description: "Level 2 shared SRAM with ECC - the work memory"
    type: "l2_isle"
    clock_domain: "host"
    system_config:
      is_l2_mem: true
    interfaces:
      # l2_isle connects through its async CDC ports (the only ones it has);
      # both sides run on the same clock here, the CDC just adds latency.
      axi_slave:
        # Inside the host's CIE window [0x7800_0000, 0x8000_0000), astral's own
        # L2 base (see crux.yml for the wave-six shadowing rationale).
        - base_addr: 0x78000000
          size: 0x00100000
          sync_domain: false
      regbus_slave:
        - base_addr: 0x2000B000
          size: 0x00001000
          sync_domain: false

# ------------------------------------------------------------------------------
# 7. TESTBENCH
# ------------------------------------------------------------------------------
testbench:
  # AUTONOMOUS boot (wave six): the strap selects the SPI-flash source, the
  # generated testbench instantiates the flash model the host contract names,
  # preloaded with the GPT image the sw flow builds, and the bootrom does the
  # rest. NO preload_mode / preload_memories: the image travels inside the
  # boot device, and the firmware is linked for the host's internal
  # scratchpad (BootSpmOffset/Size), not for the L2.
  boot_mode: spi_flash
  boot_timeout_ns: 10000000
  boot_timeout_fast_ns: 2000000
  # The measured flash boot reaches end-of-test at 4.86 ms simulated (63 s of
  # wall clock); 20 ms gives a 4x margin without letting a silent hang run long.
  sim_timeout_ns: 20000000

# ------------------------------------------------------------------------------
# 8. SOFTWARE STACK & FIRMWARE
# ------------------------------------------------------------------------------
software_stack:
  toolchain: "riscv64-unknown-elf-"
  boot_memory: "l2_shared_memory"
  test_app:
    name: "hello_world"
    auto_generate_c: true
    # Console-only line (the boot needs no UART): the ROM-independent choice
    # would be free, but 115200 keeps the console timing identical to the
    # rest of the mini class.
    baudrate: 115200
