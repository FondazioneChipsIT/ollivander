dependencies:
  cheshire:
    patches:
      - file: "{bender_work}/cheshire/hw/cheshire_pkg.sv"
        search: "    ret.apb_mask[ret.slink] = 1'b1;"
        replace: "    if (cfg.SerialLink) begin\\n      ret.apb_mask[ret.slink] = 1'b1;\\n    end"
  cva6:
    patches:
      - file: "{bender_work}/cva6/Bender.yml"
        search: "      - core/include/wt_cache_pkg.sv"
        replace: "      - core/include/aes_pkg.sv\n      - core/include/wt_cache_pkg.sv"
      - file: "{bender_work}/cva6/Bender.yml"
        search: "      - core/alu.sv"
        replace: "      - core/alu.sv\n      - core/aes.sv"
      - file: "{bender_work}/cva6/core/include/aes_pkg.sv"
        search: "package aes_pkg;"
        replace: "package cva6_aes_pkg;"
      - file: "{bender_work}/cva6/core/aes.sv"
        search: "import aes_pkg::*;"
        replace: "import cva6_aes_pkg::*;"
      - file: "{bender_work}/cva6/core/aes.sv"
        search: "module aes"
        replace: "module cva6_aes"
      - file: "{bender_work}/cva6/core/ex_stage.sv"
        search: "import aes_pkg::*;"
        replace: "import cva6_aes_pkg::*;"
      - file: "{bender_work}/cva6/core/ex_stage.sv"
        search: "      aes #("
        replace: "      cva6_aes #("
  snitch_cluster:
    patches:
      - file: "{bender_work}/snitch_cluster/Bender.yml"
        search: "  - target: all(snitch_cluster_wrapper, any(simulation, verilator))\n    include_dirs:\n      - hw/generated\n    files:\n      - target/sim/tb/vip_snitch_cluster.sv\n      - target/sim/tb/testharness.sv"
        replace: "  - target: all(snitch_cluster_wrapper, any(simulation, verilator))\n    include_dirs:\n      - hw/generated\n    files: []"
    bender_targets:
      - "snitch_cluster"
      - "snitch_cluster_wrapper"
  axi_obi:
    patches:
      - file: "{bender_work}/axi_obi/src/axi_to_obi.sv"
        search: "    assign rsp_read_ruser_o [i] = rsp_ruser[         i][IdRuserWidth-1:ObiCfg.IdWidth];"
        replace: "    if (IdRuserWidth > ObiCfg.IdWidth) assign rsp_read_ruser_o [i] = rsp_ruser[         i][IdRuserWidth-1:ObiCfg.IdWidth];"
      - file: "{bender_work}/axi_obi/src/axi_to_obi.sv"
        search: "    assign rsp_write_ruser_o[i] = rsp_ruser[NumBanks+i][IdRuserWidth-1:ObiCfg.IdWidth];"
        replace: "    if (IdRuserWidth > ObiCfg.IdWidth) assign rsp_write_ruser_o[i] = rsp_ruser[NumBanks+i][IdRuserWidth-1:ObiCfg.IdWidth];"
