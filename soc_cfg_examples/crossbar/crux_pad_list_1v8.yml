  is_static: true
  connections:
    chip2pad: hyperbus_rwds_o
    pad2chip: hyperbus_rwds_i
    paden2chip: hyperbus_rwds_oe_o

- name: "PAD_HYPERBUS_DQ_{i}"
  description: "Hyperbus DQ {i}"
  pad_type: PAD_BIDIR
  multiple: 8
  is_static: true
  connections:
    chip2pad: hyperbus_dq_o_{i}
