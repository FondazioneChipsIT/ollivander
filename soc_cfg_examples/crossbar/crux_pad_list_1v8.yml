# 1.8V Pad Domain - High-Speed Interfaces & Clocks

- name: PAD_CLK
  description: "Global Clock"
  pad_type: PAD_INPUT
  is_static: true
  connections:
    pad2chip: ref_clk_i

- name: PAD_RST_N
  description: "Global Reset (Active Low)"
  pad_type: PAD_INPUT
  is_static: true
  connections:
    pad2chip: pwr_on_rst_ni

- name: PAD_ETH_MDIO
  description: "Ethernet MDIO"
  pad_type: PAD_BIDIR
  is_static: true
  connections:
    chip2pad: ethernet_phy_mdio_o
    pad2chip: ethernet_phy_mdio_i
    paden2chip: ethernet_phy_mdio_oe

- name: PAD_SPI_SCK
  description: "Host SPI SCK"
  pad_type: PAD_BIDIR
  is_static: true
  connections:
    chip2pad: spi_sck_o
    paden2chip: spi_sck_en_o

- name: PAD_SPI_CSB
  description: "Host SPI CSB"
  pad_type: PAD_BIDIR
  is_static: true
  connections:
    chip2pad: spi_csb_o
    paden2chip: spi_csb_en_o

- name: "PAD_SPI_SD_{i}"
  description: "Host SPI SD {i}"
  pad_type: PAD_BIDIR
  multiple: 4
  is_static: true
  connections:
    chip2pad: spi_sd_o_{i}
    pad2chip: spi_sd_i_{i}
    paden2chip: spi_sd_en_o_{i}

- name: PAD_HYPERBUS_CK
  description: "Hyperbus CK"
  pad_type: PAD_OUTPUT
  is_static: true
  connections:
    chip2pad: hyperbus_ck_o

- name: "PAD_HYPERBUS_CS_{i}"
  description: "Hyperbus CS {i}"
  pad_type: PAD_OUTPUT
  multiple: 2
  is_static: true
  connections:
    chip2pad: hyperbus_cs_no_{i}

- name: PAD_HYPERBUS_RWDS
  description: "Hyperbus RWDS"
