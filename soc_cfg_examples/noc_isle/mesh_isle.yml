# ==============================================================================
# OLLIVANDER UNIFIED SoC ARCHITECTURE SCHEMA - MESH CONFIGURATION
# ==============================================================================
# This YAML file describes the Mesh SoC using the Unified Component Model.
# Ollivander will parse this, recognize the "noc" topology switch, and map
# the components' logical placements to physical coordinates for FlooNoC.
# ==============================================================================

project:
  name: "mesh"
  description: "AI and Machine Learning acceleration platform (Gwaihir clone)"
  author: "Ollivander Generator"
  build_mode: "macro"
  vendor: "Chips-IT"          # IP-XACT component vendor metadata
  library: "SoC"              # IP-XACT component library name metadata
  version: "1.0.0"            # IP-XACT component version metadata
  macro_settings:
    export_type: "isle"
    # Export a single unified standard AXI interface (narrow+wide merged via the join adapter)
    slaves:
      - bus_type: "standard"
        target: "[9,3].East"
    masters:
      - bus_type: "standard"
        target: "[9,3].East"

# ------------------------------------------------------------------------------
# 1. TOPOLOGY & INTERCONNECT
# ------------------------------------------------------------------------------
# The master switch for Ollivander to use FlooNoC templates instead of Crossbar.
# In a "noc" topology, components are wrapped in standard "Tiles" and placed
# on a 2D physical routing mesh.
topology:
  type: "noc"
  noc_settings:
    type: "floo_noc"
    routing_algorithm: "XY"     # Deterministic XY routing algorithm
    networks:
      # FlooNoC supports multiple parallel physical networks to separate traffic classes.
      narrow: { data_width: 64, addr_width: 48 }
      wide:   { data_width: 512, addr_width: 48 }
    default_tile: "dummy_tile"  # Used to fill empty coordinates in the 2D mesh
    # FlooNoC collective set, the reduction pair: declared explicitly because the schema
    # defaults BOTH channels off; each channel is enabled independently. The wide FP reduction is part
    # of the reference configuration this SoC mirrors; depth and cut restate the RTL's own
    # RedDefaultCfg. The narrow (integer) channel joins once the functional-test wave clears
    # it - enabling it is the subject of the collectives probe (wip 3.6.1).
    collectives:
      # The narrow, stamper-based integer reduction (dimension-ordered, two phases)
      # has its witness here; the wide FP one lives in noc (see there).
      narrow_reduction: { enable: true, rd_pipeline_depth: 5, cut_offload_intf: true }

# ------------------------------------------------------------------------------
# 2. SYSTEM MICROARCHITECTURE SETTINGS
# ------------------------------------------------------------------------------
# Defines global microarchitectural parameters to ensure system-wide coherence
# across all components. In a NoC, these size the FIFOs and adapters inside 
# the individual Tile wrappers.
system_settings:
  # Mapping of the AXI 'user' field bits for system-wide coherence
  user_mapping:
    amo_msb: 2          # MSB of the AMO Hart ID (used for LR/SC reservation tracking)
    amo_lsb: 0          # LSB of the AMO Hart ID
    ecc_err_bit: 4      # Bit index for ECC error reporting
    
  # Microarchitecture parameters for the Shared Memory (LLC/L2)
  llc:
    max_read_txns: 32   # Outstanding read transactions
    max_write_txns: 32  # Outstanding write transactions
    amo_num_cuts: 1     # AXI cuts for Atomic Memory Operations
    amo_post_cut: true  # Do not bypass cut after AMO conversion
    
  # Microarchitecture parameters for Peripheral RegBuses
  reg_bus:
    max_read_txns: 8    # Outstanding read transactions
    max_write_txns: 8   # Outstanding write transactions
    amo_num_cuts: 1     # AXI cuts for Atomic Memory Operations
    amo_post_cut: true  # Do not bypass cut after AMO to RegBus conversion

# ------------------------------------------------------------------------------
# 3. CLOCK & RESET DOMAINS
# ------------------------------------------------------------------------------
# Defines the clock generation and distribution network.
# Resets are automatically derived from clock domains unless explicitly overridden.
clock_tree:
  generators: 0 # 0 means no clock generators are instantiated in the chip wrapper (clocks are supplied directly from pads)
  domains:
    - name: "rt"
      description: "Real-Time Clock for CLINT and AON timers"
      is_real_time: true
      has_mux: false
      has_divider: false

    - name: "system"
      description: "Main synchronous clock domain for the entire NoC"
      is_real_time: false
      has_mux: false
      has_divider: false
      has_debug_divider: false

# ------------------------------------------------------------------------------
# 4. GLOBAL SYSTEM CONTROLLER & REGISTERS
# ------------------------------------------------------------------------------
# Ollivander will generate the SystemRDL specification from this section via PeakRDL.
system_controller:
  description: "Main system control and status registers (PCRs)"
  name: "gw_soc_regs"
  base_addr: 0x20000000       # Memory mapped base address
  size: 0x00001000            # Size of the memory region
  scratch_registers: 2        # Number of generic GENERIC_SCRATCHx registers
  version_registers: 1        # Number of VERSIONx registers
  jedec_id: 0x00000000        # Value for the JEDEC_IDCODE register
  clk_gen_status_regs: false  # Clock generators are outside the SoC, no internal lock status
  
  # Registers implemented outside the SoC top-level (e.g., in the chip/padframe wrapper).
  # Ollivander maps these in the RDL (conditionally) and exports the RegBus at the top-level.
  external_registers:
    - name: "fll"
      base_addr: 0x20001000
    - name: "gw_chip_regs"
      base_addr: 0x20002000
      
  # Auto Control Groups are a powerful feature for NoC arrays.
  # Instead of generating a separate CSR for each tile instance, it groups them by 
  # 'target_component_type' and generates a single packed array register.
  auto_control_groups:
    - name: "cluster_ctrl"
      type: "clk_rst_control"
      target_component_type: "cluster_subtile" # Ollivander auto-sizes this based on count
    - name: "pulp_ctrl"
      type: "clk_rst_control"
      target_component_type: "pulp_cluster_isle" # the 2x2 PULP array below, one bit per tile
    - name: "mem_tile_ctrl"
      type: "clk_rst_control"
      target_component_type: "sram_isle"

# ------------------------------------------------------------------------------
# 5. HOST SYSTEM (Manager)
# ------------------------------------------------------------------------------
host:
  name: "manager"
  description: "Main application processor (Cheshire host)"
  type: "cheshire_isle"
  clock_domain: "system"
  isa: "rv64imafdc_zifencei"  # Host ISA for the software compiler. CVA6 implements fence.i
                              # (the offload app relies on it to publish the payload); modern
                              # binutils want the extension spelled out in the -march string.
  abi: "lp64d"                # Host Application Binary Interface (ABI) for software compiler
  cmodel: "medany"            # Host Code Model for software compiler
  placement:
    logical: { x: 9, y: 3 } # Physical 2D coordinate on the FlooNoC mesh
  export_interfaces: ["jtag", "gpio", "slink", "uart", "spi", "i2c"]
  interrupts:
    # INTERRUPT ROUTING ON THE MESH. Same syntax as the crossbar family: the host aggregates
    # external lines into its PLIC through intr_ext_i, and the generator routes each source
    # from the tile that owns it. Bit 0 carries a mailbox line: the generated offload test
    # raises it through the mailbox's registers and reads it back in the PLIC's pending
    # word, which proves the whole route mailbox -> wire -> host tile -> PLIC.
    intr_ext_i:
      cdc: false
      source: >
        {
          [0] : mailbox.snd_irq_o[7]
        }
  interfaces:
    axi_master: true
    noc_networks:
      # The Host initiates traffic only on the narrow network, but can be
      # accessed as a slave from both narrow and wide networks.
      master: ["narrow"]
      slave: ["narrow", "wide"]
      noc_mode: "joined_narrow" # Automatically instantiates a FlooNoC Join adapter (narrow 64-bit)
    axi_slave:
      - name: "internal_rom_ram"
        base_addr: 0x00000000
        size: 0x18000000      # 384 MB reserved for internal ROM/RAM/CLINT/PLIC
  features:
    # Automatically instantiates dummy AXI slaves returning DECERR for these unconnected ports
    error_slaves: ["async_axi_llc", "axi_llc"]
    # Automatically ties off these specific native ports to 0 (inputs) or leaves them unconnected
    terminate_ports: ["async_axi_in", "async_axi_out"]
  parameters:                 # Renamed from system_config to match HW-First semantics
    Vga: false                # Aligned standard Cheshire parameter name
    # The serial link must be BUILT, not merely exported: preload_mode 'slink'
    # streams the boot image through it (wip 2.1), and pins over a
    # stubbed-out link are dead wires the generator now refuses.
    SerialLink: true
    # The CIE window is CVA6's cached+executable slice of the external space:
    # [0x8000_0000 - length, 0x8000_0000) with OnTop. 0x5E00_0000 starts it at
    # the L2 (0x2200_0000): the host image boots from there and must stay
    # executable, and the offload payload (carved from the same L2) is
    # published through fence.i, while the cluster windows at 0x2100_0000
    # stay UNCACHED - the offload firmware polls its return slots there, and
    # a cached poll would spin on a stale line forever.
    Cva6ExtCieLength: 0x5E000000
    Cva6ExtCieOnTop: true
    LlcCdcSyncStages: 0

# ------------------------------------------------------------------------------
# 6. SYSTEM COMPONENTS (Compute, Memories, Peripherals)
# ------------------------------------------------------------------------------
# List of all hardware blocks attached to the SoC. 
# In a NoC, each block MUST be encapsulated in a "Tile" wrapper (or an "Isle" 
# which Ollivander will automatically wrap in a Universal Tile).
components:
  # -- COMPUTE CLUSTERS (Snitch) --
  - name: "compute_clusters"
    description: "AI and Machine Learning compute clusters"
    type: "cluster_subtile"
    clock_domain: "system"
    # A 'box' placement automatically generates a 2D array of instances.
    # Here: X from 4 to 7 (4 columns), Y from 2 to 3 (2 rows) = 8 clusters, the upper
    # half of the compute area; the lower-left quarter is the PULP array below and the
    # lower-right quarter stays dummy. The asymmetric box is deliberate: the two-phase
    # collectives (column first, then the row of heads) are exercised on a 2x4 here,
    # while the square 4x4 is covered by the 'noc' and 'noc_subtile' examples.
    placement:
      logical:
        box: { x_start: 4, x_end: 7, y_start: 2, y_end: 3 }
    export_interfaces: ["debug_req"]
    interfaces:
      axi_master: true
      noc_networks:
        master: ["narrow", "wide"]
        slave: ["narrow", "wide"]
        # "dual" mode means the component natively exposes two separate AXI ports
        # (one for narrow, one for wide) without needing a Join adapter.
        noc_mode: "dual"
      axi_slave:
        - name: "cluster_tcdm_and_periph"
          base_addr: 0x21000000
          size_per_instance: 0x00040000 # 256 kB per cluster
    features: 
      multicast_target: true  
    parameters:
      UseHWPE: true

  # -- SHARED L2 MEMORY --
  - name: "pulp_cluster"
    description: "PULP multicore clusters (RI5CY), a 2x2 array started by wire"
    type: "pulp_cluster_isle"
    clock_domain: "system"
    # THE WIRE-CONTROLLED WITNESS OF THE MESH. Unlike the Snitch clusters (memory-mapped
    # start), these are released by the System Controller's fetch-enable wire and report
    # completion on their eoc_o wire: one bit per instance in both registers. The isle
    # publishes asynchronous AXI buses (its own CDC half); the tile closes them against
    # the network clock.
    placement:
      logical:
        box: { x_start: 4, x_end: 5, y_start: 0, y_end: 1 }
    interfaces:
      axi_master: true
      noc_networks:
        master: ["narrow"]
        slave: ["narrow"]
      axi_slave:
        # One window per instance at the stride the IP itself decodes (cluster_bus_wrap:
        # base + (instance_id << 22)): the isle declares it (InstanceIdStride, 4 MB) and
        # the generator takes it as size_per_instance; a different value here is refused.
        - name: "pulp_tcdm_and_periph"
          base_addr: 0x30000000
          sync_domain: false     # the isle's ports are asynchronous (its own CDC half); the tile closes them
    system_config:
      isolate: true
      fetch_enable: true
      boot_enable: true
      boot_addr: 0x22000000     # the payload region (L2), rewritten by the test firmware
      has_busy_status: true
      has_eoc_status: true
    interrupts:
      # The other mailbox line lands on the PULP clusters' mailbox interrupt: observed by the
      # testbench on the top-level wire, not handled by the payload.
      mbox_irq_i: { source: "mailbox.snd_irq_o[4]", cdc: false }

  - name: "mailbox"
    description: "Centralized mailbox for cross-domain software interrupts (MSI)"
    type: "mailbox_isle"
    clock_domain: "system"
    placement:
      logical: { x: 9, y: 0 }  # the host's column, a free slot
    interfaces:
      noc_networks:
        slave: ["narrow"]
      axi_slave:
        - name: "mailbox_regs"
          base_addr: 0x24000000
          size: 0x00001000
    parameters:
      NumMailboxes: 16

  - name: "l2_shared_memory"
    description: "Level 2 shared SRAM memory"
    type: "sram_isle" # Topology-agnostic memory block
    clock_domain: "system"
    # You can define multiple disjoint placement boxes for the same component type.
    # Here we instantiate 8 memory banks (4 on the West edge, 4 on the East edge).
    placement:
      logical:
        - box: { x_start: 0, x_end: 0, y_start: 0, y_end: 3 } # West column
        - box: { x_start: 8, x_end: 8, y_start: 0, y_end: 3 } # East inner column
    interfaces:
      noc_networks:
        slave: ["narrow", "wide"]
        noc_mode: "joined_wide"
      axi_slave:
        - name: "l2_spm_global"
          base_addr: 0x22000000
          size_per_instance: 0x00100000 # 1 MB per tile
    parameters:
      AxiUserAtop: true # Hardware atomics enabled
      SramDataWidth: 128
      SramNumWords: 1024
      MemSize: 0x00100000

  # -- NARROW SCRATCHPAD MEMORY --
  - name: "top_spm_narrow"
    description: "Narrow network scratchpad memory"
    type: "spm_isle" # Topology-agnostic single-port memory
    clock_domain: "system"
    placement:
      logical: { x: 9, y: 2 }
    interfaces:
      noc_networks:
        slave: ["narrow"]
      axi_slave:
        - name: "spm_narrow_buffer"
          base_addr: 0x23000000
          size: 0x00040000
    parameters:
      SpmWordsPerBank: 2048
      SpmDataWidth: 64

  # -- WIDE SCRATCHPAD MEMORY --
  - name: "top_spm_wide"
    description: "Wide network scratchpad memory"
    type: "spm_isle" # Topology-agnostic single-port memory
    clock_domain: "system"
    placement:
      logical: { x: 9, y: 1 }
    interfaces:
      noc_networks:
        slave: ["wide"]
      axi_slave:
        - name: "spm_wide_buffer"
          base_addr: 0x23100000
          size: 0x00040000
    parameters:
      SpmWordsPerBank: 1024
      SpmDataWidth: 128

# ------------------------------------------------------------------------------
# 7. TESTBENCH CONFIGURATION
# ------------------------------------------------------------------------------
# Instructions for the simulation environment.
testbench:
  # Boot through the VIP's JTAG agent instead of hierarchical forces (wip 2.1).
  boot_mode: jtag
  # The image streams through the serial link's AXI at bus speed (wip 2.1):
  # bring-up and handoff stay on the JTAG path above, only the
  # payload reroutes. This also frees the eight preloaded L2 tiles for
  # Verilator's hierarchical blocks - a measured ~20% gain.
  preload_mode: slink
  # Only the boot-critical domains are enabled by the testbench; the firmware
  # ungates each target when it needs it and powers it down afterwards.
  bring_up: minimal
  # Duration in ns to hold scratchpad register force values during boot.
  # This must be long enough to survive internal Host reset sequences.
  boot_force_delay_ns: 5000000
  boot_force_fast_delay_ns: 1000000
  boot_timeout_ns: 10000000
  boot_timeout_fast_ns: 2000000
  sim_timeout_ns: 10000000
  # ELF section-buffer capacity, set to the destination L2 tile's size: a
  # loadable segment larger than the memory it targets could never land
  # anyway. noc_isle is the fleet's representative of the EXPLICIT knob
  # (crux, the other ELF project, deliberately regresses the 4 MiB default).
  elf_max_section_bytes: 0x10000
  preload_memories:
    # The HOST, meaning its internal scratchpad: the always-on memory cheshire
    # keeps for exactly this purpose, so nothing external has to be powered and
    # mapped before the first fetch. The architected loaders write it BY ADDRESS
    # (the window comes from the host's HostBootSpm* contract), so no hierarchical
    # path enters the design and the host tile stays a Verilator hierarchical
    # block - which a $readmemh into an L2 tile costs us.
    - instance: "i_manager"
      # The image travels as the ELF itself ({test_app} resolves to the
      # configured app): noc_isle is the fleet's slink+elf representative in
      # the format-by-transport coverage matrix (crux carries jtag+elf; hex
      # stays covered on both transports by mesh and the two supers).
      file: "generated/sw/{test_app}.elf"
      image: elf

# ------------------------------------------------------------------------------
# 8. SOFTWARE STACK & FIRMWARE
# ------------------------------------------------------------------------------
# Defines the toolchain and target memory for automated bare-metal C compilation.
software_stack:
  toolchain: "riscv64-unknown-elf-"
  # The host's own internal scratchpad (see the preload note above): this project
  # is the fleet's witness that a mesh SoC can boot without depending on the
  # testbench to bring up a gated tile first. super_noc keeps that other path
  # covered, so the deliberate boot-memory distribution stays intact.
  boot_memory: "manager"
  test_app:
    # The offload app is a strict superset of hello_world: same greeting first,
    # then payload offload onto every component declaring an Offload* contract
    # (here: the 8 snitch cluster_subtile instances launched in parallel, then the
    # 2x2 pulp_cluster array started by wire).
    # 'payload_memory' is MANDATORY here, and the reason is the same one that makes
    # the internal scratchpad a good boot memory: it lives inside the host, on the
    # narrow network, while the snitch instruction cache refills through the
    # cluster's WIDE master. The default carve would put the payload where the
    # clusters cannot fetch it, so it is named explicitly - the L2, which both
    # networks reach.
    payload_memory: "l2_shared_memory"
    name: "offload"
    auto_generate_c: true            # Instructs Ollivander to create a basic main.c
    # Simulation-fast UART (divisor 3, ~2.08 Mbaud effective): at 115200 the UART
    # dominates the run. The generator keeps firmware and testbench monitor on the
    # same divisor; drop the key to return to 115200 for a physical terminal.
    baudrate: 2000000
