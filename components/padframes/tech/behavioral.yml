# Technology-Agnostic Behavioral Pad Macro Definitions
# Provides simple RTL assign statements for simulation.

- name: PAD_BIDIR
  description: "Standard bidirectional digital pad"
  pad_signals:
    - name: pad
      description: "External pad pin"
      size: 1
      kind: pad
    - name: pad2chip
      description: "Input to chip"
      size: 1
      kind: output
      conn_type: dynamic
    - name: chip2pad
      description: "Output from chip"
      size: 1
      kind: input
      conn_type: dynamic
      default_reset_value: 0
      default_static_value: 1'b0
    - name: paden2chip
      description: "Output enable from chip (active high)"
      size: 1
      kind: input
      conn_type: dynamic
      default_reset_value: 0
      default_static_value: 1'b0
  template: |
    % if conn.get("chip2pad") and conn.get("paden2chip"):
    assign ${conn["pad"]} = ${conn["paden2chip"]} ? ${conn["chip2pad"]} : 1'bz;
    % endif
    % if conn.get("pad2chip"):
    assign ${conn["pad2chip"]} = ${conn["pad"]};
    % endif

- name: PAD_INPUT
  description: "Standard input digital pad"
  pad_signals:
    - name: pad
      description: "External pad pin"
      size: 1
      kind: pad
    - name: pad2chip
      description: "Input to chip"
      size: 1
      kind: output
      conn_type: dynamic
  template: |
    % if conn.get("pad2chip"):
    assign ${conn["pad2chip"]} = ${conn["pad"]};
    % endif

- name: PAD_OUTPUT
  description: "Standard output digital pad"
  pad_signals:
    - name: pad
      description: "External pad pin"
      size: 1
      kind: pad
    - name: chip2pad
      description: "Output from chip"
      size: 1
      kind: input
      conn_type: dynamic
      default_reset_value: 0
      default_static_value: 1'b0
  template: |
    % if conn.get("chip2pad"):
    assign ${conn["pad"]} = ${conn["chip2pad"]};
    % endif

- name: PAD_ANALOG
  description: "Direct pass-through for analog or pre-buffered inout signals"
  pad_signals:
    - name: pad
      description: "External pad pin"
      size: 1
      kind: pad
    - name: pad_inout
      description: "Direct inout connection to the chip core"
      size: 1
      kind: pad
      conn_type: dynamic
  template: |
    % if conn.get("pad_inout"):
    alias ${conn["pad"]} = ${conn["pad_inout"]};
    % endif