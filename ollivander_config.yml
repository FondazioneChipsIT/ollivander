# Ollivander Default Environment Configuration
# Do NOT modify this file directly. To customize your environment, create a separate
# YAML file (e.g., project_env.yaml) and pass it to Ollivander via the -a (--append-env) flag.
# Default tool to use for fast architectural and connectivity checks.
# Supported options:
# - "questa": Compiles stubs and top-level using QuestaSim (default).
# - "verilator": Performs structural lint check using Verilator.
fast_check_tool: "questa"

paths:
  outdir: "generated"
  # Subdirectories created inside the 'outdir'
  sub_hw: "hw"
  sub_sw: "sw"
  sub_doc: "doc"
  sub_cfg: "cfg"
  sub_reg: "reg"
  sub_tb: "tb"
  # The {outdir} placeholder is dynamically replaced by the generator
  bender_manifest: "{outdir}/Bender.yml"
  templates:
    - "src/templates"
  components:
    - "components"
  # Directories to search for custom SystemRDL (*.rdl) files (highest priority)
  rdl_includes: []

# ==============================================================================
# CENTRALIZED DEPENDENCY REGISTRY
# ==============================================================================
# Hardware IP wrappers and templates declare dependencies by name (e.g., // BENDER: name="axi").
# Ollivander resolves them using this registry to ensure version homogeneity across the SoC.
#
# Supported configuration properties per dependency:
# - git/rev/version: Source repository and specific commit/tag/branch.
# - bender_targets: Specific compilation targets passed to Bender during simulation/synthesis.
# - patches: On-the-fly text replacements applied to the fetched IP's source code. Each entry is
#   a {file, search, replace} triple; "\n" in the replacement becomes a newline. Use it for a
#   substitution, e.g. redirecting a call from one package to another. Note that every target file
#   is restored to its fetched state before the patches are applied, so that the result does not
#   depend on what ran before: editing a patch replaces the old text rather than layering over it,
#   and editing a target file by hand is pointless because the next generation reverts it. To work
#   on a dependency, use `bender clone` instead.
#   AT MOST THREE patches per dependency live inline here: a larger set moves verbatim to a
#   script under scripts/ invoked from pre_build_cmds (patch_pulp_cluster.py is the template),
#   which records its edits in the same .ollivander_patched ledger and is therefore restored,
#   reapplied and removable exactly like inline patches.
# - pre_build_cmds: Shell commands executed after fetching, once the IP is on disk. Use these for
#   anything a text substitution cannot express - generating RTL, or injecting a source file an
#   IP expects but does not carry. Substituted in each command:
#     {bender_work}     the checkout directory of the fetched IPs
#     {ollivander_dir}  the generator root, for scripts shipped alongside Ollivander
#     $(PYTHON)         the interpreter of the active virtual environment
#     $(MAKE), $(BENDER) the corresponding executables
#   The virtual environment's bin/ is prepended to PATH, so a script with a "python" shebang
#   picks up the right interpreter. Any other tool must simply be on PATH. For example:
#     - "$(PYTHON) {ollivander_dir}/scripts/fix_cf_math_pkg.py {bender_work}"
#     - "vsim -c -do {ollivander_dir}/scripts/gen_mem_models.tcl -quit"
#   Note that a patched checkout diverges from the revision Bender records in Bender.lock, and
#   Bender reports it as unclean (W06) and degrades it to a path dependency. Prefer declaring a
#   revision that already contains what is needed, and treat patching as a last resort.
# - rdl_include_dirs: Search paths for SystemRDL files, automatically passed to PeakRDL.
#
# This registry is GATED BY THE PRAGMAS: an entry reaches the generated Bender.yml only if a
# component or template actually instantiated declares it, so an unused entry is inert and a
# revision listed here is a default, not a constraint.
#
# Prefer a released 'version' over a 'rev' whenever the IP publishes tags AND other IPs also
# require that package. A dependency declared here is a requirement that Bender must reconcile
# with the requirements of every other package: an untagged commit cannot satisfy a semantic
# version range, so pinning one forces the project to silence the resolver with an override.
# Reserve 'rev' for leaf packages that only Ollivander requires, and for forks.
dependencies:
  apb:
    git: "https://github.com/pulp-platform/apb.git"
    version: "0.2.4"
  apb_adv_timer:
    git: "https://github.com/pulp-platform/apb_adv_timer.git"
    version: "1.0.4"
  axi:
    # The collective (multicast) support the NoC topology relies upon lives only in this fork:
    # axi_mcast_demux, axi_mcast_mux and axi_mcast_xbar have no counterpart upstream. A topology
    # Ollivander advertises must work out of the box, so the fork is declared here rather than
    # left to the user. A crossbar project that wants upstream axi can say so in its *_env.yml.
    git: "https://github.com/colluca/axi.git"
    rev: "06410c36819924e32db2afa428d244dbdbcd5d4e"
  axi_obi:
    git: "https://github.com/pulp-platform/axi_obi.git"
    version: "0.1.0"
    patches:
      # Necessary for every SoC Ollivander generates, not a precaution: components/isles/sram_isle.sv
      # sets RUserWidth to 0 in both OBI configurations, and the IP computes
      # IdRuserWidth = ObiCfg.IdWidth + RUserWidth, so the two are always equal. The unguarded
      # slice [IdRuserWidth-1:ObiCfg.IdWidth] then degenerates: vopt reports "Range of part-select
      # [1:2] into 'rsp_ruser' [1:0] is reversed" and the design does not load. Verified by removing
      # the patch, which fails the NoC simulation with 12 elaboration errors.
      - file: "{bender_work}/axi_obi/src/axi_to_obi.sv"
        search: "    assign rsp_read_ruser_o [i] = rsp_ruser[         i][IdRuserWidth-1:ObiCfg.IdWidth];"
        replace: "    if (IdRuserWidth > ObiCfg.IdWidth) assign rsp_read_ruser_o [i] = rsp_ruser[         i][IdRuserWidth-1:ObiCfg.IdWidth];"
      - file: "{bender_work}/axi_obi/src/axi_to_obi.sv"
        search: "    assign rsp_write_ruser_o[i] = rsp_ruser[NumBanks+i][IdRuserWidth-1:ObiCfg.IdWidth];"
        replace: "    if (IdRuserWidth > ObiCfg.IdWidth) assign rsp_write_ruser_o[i] = rsp_ruser[NumBanks+i][IdRuserWidth-1:ObiCfg.IdWidth];"
  can_bus:
    git: "https://github.com/AlSaqr-platform/can_bus.git"
    rev: "0ec0bf8b7dab6d5e4b3f7ec58338a8efee066379"
  cheshire:
    git: "https://github.com/pulp-platform/cheshire.git"
    rev: "55650af4adf63fa2f445c063983bb91e363b3ff1"
    rdl_include_dirs:
      - "hw"
      - "hw/regs"
    bender_targets:
      - "cheshire"
      - "cva6"
      - "cv64a6_imafdc_sv39"
      - "cv64a6splus_imafdc_sv39_hpdcache_wb"
      - "deprecated"
    pre_build_cmds:
      - "mkdir -p {bender_work}/cheshire/target/sim/models"
      - "touch {bender_work}/cheshire/target/sim/models/s25fs512s.v"
      - "touch {bender_work}/cheshire/target/sim/models/24FC1025.v"
    patches:
      # An upstream defect, worth a pull request: ret.slink is assigned only inside
      # `if (cfg.SerialLink)`, yet ret.apb_mask[ret.slink] is set unconditionally. With the serial
      # link disabled the index stays 0 and the mask of an unrelated peripheral is raised, which
      # enables a generate block that then drives reg_out_rsp[0] a second time - vopt-7045, and the
      # design does not load. Verified by removing this patch: both topologies fail identically. The
      # guard changes nothing for a configuration that does enable the serial link.
      - file: "{bender_work}/cheshire/hw/cheshire_pkg.sv"
        search: "    ret.apb_mask[ret.slink] = 1'b1;"
        replace: "    if (cfg.SerialLink) begin\\n      ret.apb_mask[ret.slink] = 1'b1;\\n    end"
      # The PeakRDL-generated register storage is an unpacked struct holding an unpacked array,
      # and Verilator's V3Force cannot build force infrastructure through unpacked composites
      # ("opaque force path selector ARRAYSEL", internal error): the testbench force on the boot
      # scratch registers stops the whole verilator flow. The packed layout is bit-identical,
      # internal to the regblock (the hwif contract is untouched) and validated on both
      # simulators. Our own PeakRDL outputs get the same treatment in tool_runners.py.
      - file: "{bender_work}/cheshire/hw/regs/cheshire_soc_regs.sv"
        search: "    typedef struct {\n        struct {\n            struct {\n                logic [31:0] value;\n            } scratch;\n        } scratch[16];\n    } field_storage_t;"
        replace: "    typedef struct packed {\\n        struct packed {\\n            struct packed {\\n                logic [31:0] value;\\n            } scratch;\\n        } [15:0] scratch;\\n    } field_storage_t;"
  common_cells:
    git: "https://github.com/pulp-platform/common_cells.git"
    version: "1.40.0"
  cva6:
    # Not declared as a dependency: cva6 arrives transitively through cheshire. This entry exists
    # only to repair it, and the repair is conditional in a way a declarative patch cannot express.
    # The scalar-cryptography sources must always be compiled, because cva6's own manifest omits
    # them while ex_stage.sv instantiates the unit; the rename to cva6_aes_* is instead needed only
    # where another IP declares a competing 'aes', as OpenTitan does. Removing the previous flat
    # patches showed the two halves failing differently: "Module 'aes' is not defined" on the NoC,
    # and "Port 'fu_data_i' not found in module 'aes'" on the crossbar, where the instance bound
    # OpenTitan's module instead. The script reports which IP it collided with when it renames.
    pre_build_cmds:
      - "$(PYTHON) {ollivander_dir}/scripts/patch_cva6_aes.py {bender_work}"
  datamover:
    git: "https://github.com/pulp-platform/datamover.git"
    rev: "f14d4db2a72c08b43b3511013e821a4600f6ef56"
    # datamover targets a newer hci whose hci_core_source/sink declare ELEMENT_WIDTH and
    # ELEMENTS_PER_BANK; the hci revision forced above does not, so these four overrides are
    # dead. QuestaSim drops them with a vopt-2732 warning, Verilator's single compilation unit
    # makes them a PINNOTFOUND error. An alignment to our hci forcing, like pulp_cluster's -
    # NOT an upstream defect; it lives or dies with the forcing. Each pair covers both the
    # source and the sink instance (the lines are identical and str.replace hits every one).
    patches:
      - file: "{bender_work}/datamover/rtl/datamover_streamer.sv"
        search: "    .ELEMENT_WIDTH         ( ELEM_WIDTH            ), // e.g., 8 bits per element"
        replace: ""
      - file: "{bender_work}/datamover/rtl/datamover_streamer.sv"
        search: "    .ELEMENTS_PER_BANK     ( NUM_ELEM_WORD         ), // number of elements in one memory bank word"
        replace: ""
  dyn_mem:
    git: "https://github.com/pulp-platform/dyn_spm.git"
    rev: "78d4b4248b3c7b02a0e61d683f658e5094ac8c44"
  floo_noc:
    git: "https://github.com/pulp-platform/FlooNoC.git"
    version: "0.8.0"
  hci:
    git: "https://github.com/FondazioneChipsIT/hci.git"
    rev: "3e63936991569d0b1e315d6914478937b37bb338"
    # git: "https://github.com/pulp-platform/hci.git"
    # rev: "master"
    patches:
      # Three copy-paste typos in the ECC-handshake generate branches: r_evalid is
      # derived from itself where the twin line above derives egnt from gnt, so the
      # signal is a combinational self-loop. QuestaSim elaborates it silently (the
      # wire just sticks - latent while nothing exercises the cluster), Verilator
      # refuses it as circular logic. Real functional defect, upstream candidate
      # toward pulp-platform/hci and a direct fix for the CHIPS-IT fork.
      - file: "{bender_work}/hci/rtl/core/hci_core_mux_static.sv"
        search: "      assign in_r_evalid[ii] = '{default: {in_r_evalid[ii]}};"
        replace: "      assign in_r_evalid[ii] = '{default: {in_r_valid[ii]}};"
      - file: "{bender_work}/hci/rtl/interco/hci_router.sv"
        search: "    assign postfifo.r_evalid = '{default: {postfifo.r_evalid}};"
        replace: "    assign postfifo.r_evalid = '{default: {postfifo.r_valid}};"
      - file: "{bender_work}/hci/rtl/core/hci_core_split.sv"
        search: "    assign tcdm_target.r_evalid = '{default: {tcdm_target.r_evalid}};"
        replace: "    assign tcdm_target.r_evalid = '{default: {tcdm_target.r_valid}};"
  hyperbus:
    git: "https://github.com/pulp-platform/hyperbus.git"
    rev: "6cbbff063ee2f36408106cca84d7ec668d7c8577"
  idma:
    # The CHIPS-IT fork, at tag ChipsIt-v0.0.0. pulp_cluster and opentitan require iDMA from here,
    # and it is the side that declares Burst_len: the backends are generated from templates by the
    # pre-build command below, and idma_legalizer.sv.tpl carries that parameter while upstream does
    # not. Forcing the upstream instead made pulp_cluster's override of .Burst_len be discarded.
    git: "https://github.com/FondazioneChipsIT/iDMA.git"
    rev: "2e637216e0455d77706a50d0639b86891e2a83aa"
    bender_targets:
      - "idma"
      - "use_idma"
    # Pre-build commands are executed directly by Ollivander (Python) immediately after fetching.
    # The $(PYTHON), $(MAKE), and $(BENDER) macros are safely substituted at runtime.
    # Paths can use {bender_work} (download dir) or {ollivander_dir} (generator root) placeholders.
    pre_build_cmds:
      - "$(PYTHON) -m pip install -q flatdict mako"
      - "$(MAKE) -C {bender_work}/idma idma_hw_all BENDER=\"$(BENDER)\""
  mailbox_unit:
    git: "https://github.com/pulp-platform/mailbox_unit.git"
    # A release rather than a commit: opentitan requires this package as ^1.1.0, and an untagged
    # commit cannot satisfy a semantic version range - it would force the project into an override.
    version: "1.1.0"
  obi:
    git: "https://github.com/pulp-platform/obi.git"
    version: "0.1.7"
  # Transitive dependencies (pulled in by pulp_cluster / redmule / hci): never declared
  # by a pragma, listed here only to carry patches - run_pre_build_steps applies patches
  # to any entry whose checkout exists, and an entry with no git source contributes
  # nothing to the generated manifests.
  #
  # hier-icache: a raw SVA property block guarded by SYNTHESIS alone, so every simulator
  # sees it; Verilator cannot parse the ##[0:1] cycle-delay range (upstream PR candidate:
  # extend the guard). The added VERILATOR guard nests inside the SYNTHESIS one.
  # hwpe-ctrl: hwpe_ctrl_slave drives its packed flags_o struct with mixed styles - start,
  # evt, is_working and sw_evt non-blocking in always_ff processes, done and enable
  # combinationally - which is legal SV that QuestaSim accepts but Verilator rejects as
  # unsupported (BLKANDNBLK) at the redmule and datamover instantiations. The repair moves
  # the sequential fields to intermediate registers exposed through continuous assigns,
  # semantics identical. Order matters: the four renames run on the pristine file first,
  # then the declaration block (already using the final names) is anchored on the untouched
  # 'flags_o.done' assign. Possible Verilator-compatibility PR upstream, to verify at HEAD.
  # hwpe-ctrl: hwpe_ctrl_slave drives its packed flags_o with mixed styles, which
  # Verilator refuses (BLKANDNBLK); the five ORDERED replacements moved to the script
  # per the three-patch rule above. Full rationale in the script header.
  hwpe-ctrl:
    pre_build_cmds:
      - "$(PYTHON) {ollivander_dir}/scripts/patch_hwpe_ctrl.py {bender_work}"
  # ibex: its vendored lowrisc_ip prim_assert macros clash with common_cells' modern
  # assertion signatures inside Verilator's single compilation unit; the eleven
  # signature-alignment replacements moved to the script per the three-patch rule
  # above. Full rationale in the script header.
  ibex:
    pre_build_cmds:
      - "$(PYTHON) {ollivander_dir}/scripts/patch_ibex_prim_asserts.py {bender_work}"
  # neureka: a 36-bit literal in a 9-bit case item; QuestaSim truncates it to the same
  # 9'h1ff Verilator refuses to guess (upstream PR candidate: fix the literal).
  # Re-verified failing on Verilator 5.050 on 2026-08-07 (registry audit, wip 3.7).
  neureka:
    patches:
      - file: "{bender_work}/neureka/rtl/ctrl/neureka_ctrl.sv"
        search: "9'h0ffffffff"
        replace: "9'h1ff"
  opentitan:
    git: "https://github.com/AlSaqr-platform/opentitan.git"
    rev: "212974d8a61c45de6f61354adc55cc08e100ed58"
    # opentitan's vendored ibex collides with the standalone ibex the safety island brings
    # into the same graph - every ibex_* global name is declared twice, QuestaSim hides it
    # as a suppressed design-unit overwrite (13233) and survives on version compatibility,
    # Verilator's single compilation unit does not. The script renames the vendored side to
    # ot_ibex_*, discovering the colliding set at every run; inert when either tree is
    # absent. Same repair family as cva6's aes and spatz/snitch.
    pre_build_cmds:
      - "$(PYTHON) {ollivander_dir}/scripts/patch_ibex_ot.py {bender_work}"
      # Two axi-fork literal completions and the removal of a dead verification
      # cluster from the manifest; see the script header.
      - "$(PYTHON) {ollivander_dir}/scripts/patch_opentitan.py {bender_work}"
  pulp-ethernet:
    git: "https://github.com/pulp-platform/pulp-ethernet.git"
    rev: "db9a90dd27fa85ddbe9b7cd22e03bf43b2c14838"
  pulp_cluster:
    git: "https://github.com/FondazioneChipsIT/pulp_cluster.git"
    rev: "e8c34e7199cb44417215fa51ccf5b6983599e985"
    bender_targets:
      - "cv32e40p_use_ff_regfile"
    # Three repair families (dead hci geometry overrides, packed-ification of the
    # configuration structs for Verilator, the xbar_cfg_t literal against the axi
    # fork's multicast fields) moved to the script per the three-patch rule above.
    # Full rationale in the script header.
    pre_build_cmds:
      - "$(PYTHON) {ollivander_dir}/scripts/patch_pulp_cluster.py {bender_work}"
  redmule:
    git: "https://github.com/pulp-platform/redmule.git"
    rev: "dbcba6b1efda24dc909ebdd4ace132f798c8c12b"
  register_interface:
    git: "https://github.com/pulp-platform/register_interface.git"
    version: "0.4.7"
  safety_island:
    git: "https://github.com/pulp-platform/safety_island.git"
    rev: "d9feaedcec1d2fa09fbb57cd1c910fa9a821a0de"
  snitch_cluster:
    git: "https://github.com/pulp-platform/snitch_cluster.git"
    rev: "2fa38482c2c822bfbedfdfd87abb3ed45521646e"
    bender_targets:
      - "snitch_cluster"
      - "snitch_cluster_wrapper"
    pre_build_cmds:
      - "$(PYTHON) -m pip install -q json5 jsonref jsonschema"
      - "mkdir -p .tmp_llvm_bin && ln -sfn /opt/riscv/snitch-llvm-15.0.0-snitch-0.2.0/bin/* .tmp_llvm_bin/ && ln -sfn /opt/riscv/snitch-llvm-15.0.0-snitch-0.2.0/bin/clang .tmp_llvm_bin/riscv32-unknown-elf-clang"
      - "PATH=$(pwd)/.tmp_llvm_bin:$PATH $(MAKE) -C {bender_work}/snitch_cluster rtl"
      # Removal of the IP's testharness and of four dead verification clusters from
      # the manifest; see the script header.
      - "$(PYTHON) {ollivander_dir}/scripts/patch_snitch_cluster.py {bender_work}"
  spatz:
    git: "https://github.com/pulp-platform/spatz.git"
    rev: "a779a93426abe80e6c82418e678cec9b70af56ed"
    bender_targets:
      - "spatz"
    # ONE list for both commands: this entry used to carry two 'pre_build_cmds' keys, and a
    # duplicated YAML key is not an error for the loader - the last one silently wins, which
    # disabled patch_spatz.py from the day the second key was added (found 2026-08-07; the
    # loader now refuses duplicate keys precisely because of this).
    # First command: removal of the dead tcdm_interface verification cluster (script header).
    # Second: spatz vendors its own copies of the snitch core and of its companion interface
    # IPs, which collide with snitch_cluster on dozens of package, module and interface names
    # once both families share one library: the last declaration compiled wins, and elaboration
    # stops on the symbols only the newer revision declares. The script discovers the colliding
    # set at every run by intersecting the declarations of the two checkouts, renames spatz's
    # side to spatz_*, and does nothing when snitch_cluster is not part of the SoC, so a
    # project without it compiles spatz exactly as fetched. See the script header.
    pre_build_cmds:
      - "$(PYTHON) {ollivander_dir}/scripts/patch_spatz.py {bender_work}"
      - "$(PYTHON) {ollivander_dir}/scripts/patch_spatz_snitch.py {bender_work}"
    # The cluster bootrom repairs (PC-relative entry sequence, sub-line slicing for
    # narrow readers) live in patch_spatz.py: the slicing fix (2026-08-10) pushed the
    # set past the three-inline-patches limit, so the whole family moved to the script
    # per the rule above. See the script docstring for the full analysis.
  timer_unit:
    git: "https://github.com/pulp-platform/timer_unit.git"
    version: "1.0.3"

# ==============================================================================
# FORCED RESOLUTIONS (Bender 'overrides')
# ==============================================================================
# Ollivander writes these into each project's Bender.local as Bender's own 'overrides' section.
# Unlike the registry above they are NOT gated by the pragmas: Bender applies them to the whole
# dependency graph, transitive dependencies included, and never reports an override it honours.
# They silence the resolver rather than satisfying it.
#
# Every entry here exists because the external IPs contradict *each other*, in ways no choice of
# versions can repair - this is the part of the catalogue that cannot be derived, only discovered,
# by stripping the overrides and letting Bender report one conflict at a time. Each is grouped
# below by the kind of contradiction, with the IPs responsible named, so that a future revision can
# be re-argued from the evidence rather than inherited on faith.
#
# An override on a package that never enters a project's graph is inert, so this list is a superset:
# some entries only matter once safety_island, spatz, opentitan or pulp_cluster are instantiated,
# and are simply ignored elsewhere. A project that disagrees with any of them can say so in its own
# *_env.yml, whose entries take precedence key by key: a mapping replaces a forcing, a null value
# drops it and hands the package back to Bender, and "inherit_default_overrides: false" declines
# this whole section - see section 4 of docs/env_configuration_guide.md.
#
# Values were validated end-to-end: crossbar and NoC both generate, elaborate under QuestaSim and
# Verilator, build and reach EOT in simulation with no project-level override at all.
overrides:

  # --- One package name, several sources. Bender resolves per name and cannot choose between
  # repositories, so these can never be negotiated - only forced.
  # axi: cheshire, floo_noc, axi_obi and register_interface require it from pulp-platform by semantic
  # version; snitch_cluster requires this fork at branch 'multicast'. The fork is also what the
  # NoC topology needs: axi_mcast_demux, axi_mcast_mux and axi_mcast_xbar exist nowhere else.
  # Verified to work for the AXI-crossbar family too, so one value serves both topologies.
  axi: { git: "https://github.com/colluca/axi.git", rev: "06410c36819924e32db2afa428d244dbdbcd5d4e" }
  # fpnew: floo_noc, redmule, snitch_cluster and cva6 require it as cvfpu.git at tag pulp-v0.2.3, while
  # cv32e40p still requires the pre-rename fpnew.git. A project rename that not everyone followed.
  fpnew: { git: "https://github.com/pulp-platform/cvfpu.git", rev: "e5aa6a01b5bbe1675c3aa8872e1203413ded83d1" }
  # hci: datamover and redmule pin two different commits of pulp-platform/hci, so they conflict with
  # each other regardless of what Ollivander declares. The CHIPS-IT fork branches from the commit
  # redmule wants and adds two fixes that are meanwhile upstream verbatim, so the fork itself no
  # longer carries anything unique - it is kept for what it does NOT have.
  #
  # Upstream from v2.6.x adds multi-precision support, and with it the ELEMENT_WIDTH and
  # ELEMENTS_PER_BANK parameters of hci_core_source and hci_core_sink. Adopting it makes the crossbar
  # family fail to compile: cluster_peripherals drives hci_ctrl_o.low_prio_max_stall, an arbiter
  # field upstream replaced with a priority_cnt_numerator/denominator pair. Remapping it is future
  # work on two CHIPS-IT repositories - see section 3.1 of docs/developer/wip/future_evolution_tasks.md.
  #
  # As a consequence, datamover's overrides of those two parameters are discarded, and vopt reports it
  # four times per NoC run as message 2732. That is BENIGN here, and the reason is worth keeping: this
  # revision hardcodes a 32-bit bank word - .DATA_WIDTH(32) in hci_core_source, byte-granular
  # realignment - and datamover passes ELEMENT_WIDTH=8 with ELEMENTS_PER_BANK=4, which is the same
  # geometry, because components/tiles/snitch_hwpe_subsystem.sv leaves both at their defaults. The
  # warnings would stop being benign the moment a tile asked for a different bank word, i.e. for the
  # multi-precision the upstream revision exists to provide. Do not silence them: they are the only
  # signal that such a request has been discarded.
  hci: { git: "https://github.com/FondazioneChipsIT/hci.git", rev: "3e63936991569d0b1e315d6914478937b37bb338" }
  # idma: three sources: cheshire and spatz require pulp-platform/iDMA by version, opentitan and
  # pulp_cluster the CHIPS-IT fork by tag, and pulp-ethernet the same pulp-platform repository
  # through an SSH URL, which Bender treats as distinct. The last one is a pure syntax split.
  # Forced to the fork, which is the only side declaring the Burst_len that pulp_cluster
  # overrides; the upstream requirements are satisfied by source compatibility, not by version.
  idma: { git: "https://github.com/FondazioneChipsIT/iDMA.git", rev: "2e637216e0455d77706a50d0639b86891e2a83aa" }

  # --- A package vendored as a path dependency inside another IP, while the rest of the graph
  # requires it from git. Bender demands that a package be a path dependency everywhere or nowhere,
  # and refuses the mixed graph outright: "not declared as a path dependency everywhere".
  # axi_obi: safety_island ships its own copy under future/axi_obi and declares it with 'path:',
  # while sram_isle requires the released v0.1.0 from git. The two never met before the super
  # examples put both families in one graph. The forcing makes the released source win graph-wide;
  # Bender still prints warning W09 for the vendored copy, and then ignores it.
  axi_obi: { git: "https://github.com/pulp-platform/axi_obi.git", rev: "84f21a6524bedcf17a569a62ac01b8a5610819c8" }

  # --- A branch requirement, which no released version can ever satisfy.
  # common_cells: axi requires branch 'multicast-xbar', snitch_cluster branch 'snitch', redmule exactly =1.38.0.
  # The value must come from the branch lineage rather than master: snitch_cluster uses
  # cf_math_pkg::iomsb and the axi fork needs stream_join_pkg.sv, neither of which exists on
  # master. The two lineages diverged on 2025-05-08 and never merged, so 'more recent' is not
  # the criterion. Verified to work for the crossbar family as well.
  common_cells: { git: "https://github.com/pulp-platform/common_cells.git", rev: "ca9d577f2fbc45ec557ab4e0905bbfc154441540" }
  # cv32e40p: pulp_cluster requires branch 'astral-v1.0', redmule branch 'pulpissimo-v4.1.0' and
  # safety_island a bare commit. Three references, two of them branches.
  cv32e40p: { git: "https://github.com/pulp-platform/cv32e40p.git", rev: "1a93f340e9dadb9f7c8c471f27a40932c8b1c62e" }
  # redundancy_cells: safety_island requires branch 'astral-v0' while dyn_mem and pulp_cluster pin two different
  # commits.
  redundancy_cells: { git: "https://github.com/pulp-platform/redundancy_cells.git", rev: "6ba6f415a9024decedabaf3f2b45263ff546dabd" }

  # --- A raw commit or an exact pin set against ranges, or against another exact pin.
  # cluster_interconnect: opentitan pins a raw commit while pulp_cluster demands exactly =1.3.0.
  cluster_interconnect: { git: "https://github.com/pulp-platform/cluster_interconnect.git", rev: "2967d8d17be0a6139229ca8d3d4956e182aec3de" }
  # hwpe-ctrl: datamover and redmule pin different raw commits. This is the shared cause of the
  # HWPE entries in this group: the accelerator family cross-pins commits of its own building
  # blocks instead of releases.
  hwpe-ctrl: { git: "https://github.com/pulp-platform/hwpe-ctrl.git", rev: "3690a3c648f120546d8de2bc583d5170c36d2f20" }
  # hwpe-stream: datamover pins an untagged commit, hci requires ^1.9.0 and redmule exactly =1.9.0. Ollivander
  # does not even declare this package: the disagreement is entirely between three other IPs.
  hwpe-stream: { git: "https://github.com/pulp-platform/hwpe-stream.git", rev: "05cb8303693065812e9d6bfe10976220fb455666" }
  # obi: our declaration and axi_obi agree on ^0.1.7, but redmule pins the untagged commit 6c7ee864.
  # The value carries the NumTxns parameter that components/isles/sram_isle.sv overrides; an
  # older revision resolves just as well but breaks elaboration, which fast-check catches.
  obi: { git: "https://github.com/pulp-platform/obi.git", rev: "6a724da5c8d6412b88b6948746e04c1adf39d017" }
  # pulp_cluster: opentitan pins a different commit of our own CHIPS-IT fork than the registry declares. The one
  # entry here where half the disagreement is ours to fix upstream.
  pulp_cluster: { git: "https://github.com/FondazioneChipsIT/pulp_cluster.git", rev: "e8c34e7199cb44417215fa51ccf5b6983599e985" }
  # scm: as hwpe-ctrl: datamover and redmule pin different raw commits.
  scm: { git: "https://github.com/pulp-platform/scm.git", rev: "472f99affe44ff7b282b519c047a3cfeb35b16c6" }
  # tech_cells_generic: fifteen packages require it, thirteen with compatible caret ranges, but redmule demands exactly
  # =0.2.13 and scm exactly =0.2.11. Two exact pins to different versions.
  tech_cells_generic: { git: "https://github.com/pulp-platform/tech_cells_generic.git", rev: "7968dd6e6180df2c644636bc6d2908a49f2190cf" }

  # --- Disjoint semantic-version ranges: the requirements are well formed, and still admit no
  # common solution.
  # axi_riscv_atomics: cheshire and safety_island require the 0.8.x series, dyn_mem and spatz the 0.7.x one.
  axi_riscv_atomics: { git: "https://github.com/pulp-platform/axi_riscv_atomics.git", rev: "97a1dd2ac643c276880420a0cf8eea697f228aa9" }
  # cluster_icache: pulp_cluster demands exactly =0.2.0 while snitch_cluster requires ^0.3.0 and
  # spatz ^0.2.0. Surfaced by the super examples, the first projects to put both cluster families
  # in one graph. Forced to v0.3.1, the value the NoC family always compiled; the crossbar family
  # elaborates against it too.
  cluster_icache: { git: "https://github.com/pulp-platform/cluster_icache.git", rev: "1642961b9561513f283674efc2c90f24855e8d39" }
  # register_interface: cheshire requires ^0.4.5 and hci ^0.3.1, two ranges with no overlap, while redmule demands
  # exactly =0.4.5.
  register_interface: { git: "https://github.com/pulp-platform/register_interface.git", rev: "d6e1d4cdaab7870f4faf3f88a1c788eaf5ac129d" }
  # riscv-dbg: cheshire and safety_island require ^0.8.1, spatz ^0.7.0.
  riscv-dbg: { git: "https://github.com/pulp-platform/riscv-dbg.git", rev: "358f90110220adf7a083f8b65d157e836d706236" }
