# Ollivander Default Environment Configuration
# Do NOT modify this file directly. To customize your environment, create a separate
# YAML file (e.g., project_env.yaml) and pass it to Ollivander via the -a (--append-env) flag.
# All paths are resolved relative to the location of this file.
paths:
  outdir: "generated"
  # Subdirectories created inside the 'outdir'
  sub_hw: "hw"
  sub_sw: "sw"
  sub_doc: "doc"
  sub_cfg: "cfg"
  sub_reg: "reg"
  sub_tb: "tb"
  # The {outdir} placeholder is dynamically replaced by the generator
  bender_manifest: "{outdir}/Bender.yml"
  templates:
    - "src/templates"
  components:
    - "components"
  # Directories to search for custom SystemRDL (*.rdl) files (highest priority)
  rdl_includes: []

# ==============================================================================
# CENTRALIZED DEPENDENCY REGISTRY
# ==============================================================================
# Hardware IP wrappers and templates declare dependencies by name (e.g., // BENDER: name="axi").
# Ollivander resolves them using this registry to ensure version homogeneity across the SoC.
#
# Supported configuration properties per dependency:
# - git/rev/version: Source repository and specific commit/tag/branch.
# - bender_targets: Specific compilation targets passed to Bender during simulation/synthesis.
# - pre_build_cmds: Shell commands executed by Python after fetching (supports {bender_work} placeholder).
# - pre_build_script: Path to a custom .py/.sh script to run after fetching the IP.
# - patches: On-the-fly text replacements applied to the fetched IP's source code.
# - rdl_include_dirs: Search paths for SystemRDL files, automatically passed to PeakRDL.
dependencies:
  apb:
    git: "https://github.com/pulp-platform/apb.git"
    rev: "master"
  apb_adv_timer:
    git: "https://github.com/pulp-platform/apb_adv_timer.git"
    rev: "master"
  axi:
    git: "https://github.com/pulp-platform/axi.git"
    rev: "master"
  axi_obi:
    git: "https://github.com/pulp-platform/axi_obi.git"
    version: "0.1.0"
  can_bus:
    git: "https://github.com/AlSaqr-platform/can_bus.git"
    rev: "pulp"
  cheshire:
    git: "https://github.com/pulp-platform/cheshire.git"
    rev: "main"
    rdl_include_dirs:
      - "hw"
      - "hw/regs"
    bender_targets:
      - "cheshire"
      - "cva6"
      - "cv64a6_imafdc_sv39"
      - "cv64a6splus_imafdc_sv39_hpdcache_wb"
      - "deprecated"
    pre_build_cmds:
      - "mkdir -p {bender_work}/cheshire/target/sim/models"
      - "touch {bender_work}/cheshire/target/sim/models/s25fs512s.v"
      - "touch {bender_work}/cheshire/target/sim/models/24FC1025.v"
  common_cells:
    git: "https://github.com/pulp-platform/common_cells.git"
    rev: "master"
  datamover:
    git: "https://github.com/pulp-platform/datamover.git"
    rev: "main"
  dyn_mem:
    git: "https://github.com/pulp-platform/dyn_spm.git"
    rev: "main"
  floo_noc:
    git: "https://github.com/pulp-platform/floonoc.git"
    rev: "main"
  hci:
    git: "https://github.com/FondazioneChipsIT/hci.git"
    rev: "3e63936991569d0b1e315d6914478937b37bb338"
    # git: "https://github.com/pulp-platform/hci.git"
    # rev: "master"
  hyperbus:
    git: "https://github.com/pulp-platform/hyperbus.git"
    rev: "main"
  idma:
    git: "https://github.com/pulp-platform/idma.git"
    version: "0.6.5"
    bender_targets:
      - "idma"
      - "use_idma"
    # Pre-build commands are executed directly by Ollivander (Python) immediately after fetching.
    # The $(PYTHON), $(MAKE), and $(BENDER) macros are safely substituted at runtime.
    # Paths can use {bender_work} (download dir) or {ollivander_dir} (generator root) placeholders.
    pre_build_cmds:
      - "$(PYTHON) -m pip install -q flatdict mako"
      - "$(MAKE) -C {bender_work}/idma idma_hw_all BENDER=\"$(BENDER)\""
  mailbox_unit:
    git: "https://github.com/pulp-platform/mailbox_unit.git"
    rev: "master"
  obi:
    git: "https://github.com/pulp-platform/obi.git"
    rev: "6a724da5c8d6412b88b6948746e04c1adf39d017"
  opentitan:
    git: "https://github.com/AlSaqr-platform/opentitan.git"
    rev: "chips-it"
    # File text replacements executed dynamically
    patches:
      - file: "{bender_work}/opentitan/Bender.yml"
        search: "prim_flop_macros.svh"
        replace: "prim_flop_macros.sv"
  # example_custom_ip:
  #   git: "https://github.com/example/custom_ip.git"
  #   version: "1.0.0"
  #   pre_build_script: "{ollivander_dir}/scripts/setup.py" # Or relative to project root
  pulp-ethernet:
    git: "https://github.com/pulp-platform/pulp-ethernet.git"
    rev: "handshake"
  pulp_cluster:
    git: "https://github.com/FondazioneChipsIT/pulp_cluster.git"
    rev: "chips-it"
    bender_targets:
      - "cv32e40p_use_ff_regfile"
    patches:
      - file: "{bender_work}/pulp_cluster/Bender.yml"
        search: "dependencies:"
        replace: "dependencies:\\n  safety_island: { path: ../safety_island }"
  redmule:
    git: "https://github.com/pulp-platform/redmule.git"
    rev: "main"
  register_interface:
    git: "https://github.com/pulp-platform/register_interface.git"
    rev: "master"
  safety_island:
    git: "https://github.com/pulp-platform/safety_island.git"
    rev: "carfield"
  snitch_cluster:
    git: "https://github.com/pulp-platform/snitch_cluster.git"
    rev: "main"
    bender_targets:
      - "snitch_cluster"
      - "scm_use_fpga_scm"
    pre_build_cmds:
      - "$(PYTHON) -m pip install -q json5 jsonref jsonschema"
      - "mkdir -p .tmp_llvm_bin && ln -sfn /opt/riscv/snitch-llvm-15.0.0-snitch-0.2.0/bin/* .tmp_llvm_bin/ && ln -sfn /opt/riscv/snitch-llvm-15.0.0-snitch-0.2.0/bin/clang .tmp_llvm_bin/riscv32-unknown-elf-clang"
      - "PATH=$(pwd)/.tmp_llvm_bin:$PATH $(MAKE) -C {bender_work}/snitch_cluster rtl"
  spatz:
    git: "https://github.com/pulp-platform/spatz.git"
    rev: "main"
    bender_targets:
      - "spatz"
  timer_unit:
    git: "https://github.com/pulp-platform/timer_unit.git"
    rev: "master"