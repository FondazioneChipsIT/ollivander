<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <!-- Theme-neutral palette: GitHub's neutral gray reads on both light and dark. -->
  <defs>
    <marker id="head" markerWidth="10" markerHeight="9" refX="5" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,4.5 L0,9 z" fill="#8b949e"/>
    </marker>
  </defs>
  <g stroke="#8b949e" fill="rgba(139,148,158,0.08)" stroke-width="1.5">
    <!-- Host Isle container: full row, crossbar as its lower band -->
    <rect x="10" y="10" width="640" height="130" rx="8"/>
    <rect x="25" y="42" width="610" height="42" rx="4"/>
    <rect x="25" y="94" width="610" height="36" rx="4"/>
    <!-- Isles -->
    <rect x="20"  y="192" width="196" height="62" rx="4"/>
    <rect x="232" y="192" width="196" height="62" rx="4"/>
    <rect x="444" y="192" width="196" height="62" rx="4"/>
  </g>
  <!-- Vertical AXI links: double-headed, prominent tips, nearly touching both ends -->
  <g stroke="#8b949e" stroke-width="2.5">
    <line x1="118" y1="152" x2="118" y2="180" marker-start="url(#head)" marker-end="url(#head)"/>
    <line x1="330" y1="152" x2="330" y2="180" marker-start="url(#head)" marker-end="url(#head)"/>
    <line x1="542" y1="152" x2="542" y2="180" marker-start="url(#head)" marker-end="url(#head)"/>
  </g>
  <g fill="#8b949e">
    <text x="22" y="30" font-size="12" letter-spacing="1" style="text-transform:uppercase">Host Isle</text>
    <text x="330" y="68" text-anchor="middle">Host (Cheshire)</text>
    <text x="330" y="117" text-anchor="middle">AXI crossbar</text>
    <text x="118" y="218" text-anchor="middle">Isle</text>
    <text x="118" y="238" text-anchor="middle" font-size="12">(L2, cluster, ...)</text>
    <text x="330" y="218" text-anchor="middle">Isle</text>
    <text x="330" y="238" text-anchor="middle" font-size="12">(safety island, ...)</text>
    <text x="542" y="218" text-anchor="middle">APB subsystem Isle</text>
    <text x="542" y="238" text-anchor="middle" font-size="12">(timers, watchdog, CAN)</text>
  </g>
</svg>
